name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Typst, poppler, and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-liberation fonts-roboto ca-certificates curl xz-utils
          sudo bash backend/scripts/install_typst.sh
      - name: Install backend
        run: python -m pip install -e "./backend[dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Mypy
        working-directory: backend
        run: mypy --strict app/services
      - name: Pytest
        working-directory: backend
        run: pytest -q
