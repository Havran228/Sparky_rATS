[project]
name = "sparky-rats"
version = "0.1.0"
description = "Sparky_rATS backend: local reverse ATS"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "lxml>=5.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.13.0",
    "uvicorn[standard]>=0.34.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]
parse = [
    "docling>=2.15.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migrations/*.sql", "llm/prompts/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."

[[tool.mypy.overrides]]
module = "app.services.*"
strict = true

[[tool.mypy.overrides]]
module = "app.docling_convert"
ignore_errors = true
