<!DOCTYPE html>
<html lang="sk">
<head>
  <title>Backend engineer</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "JobPosting",
    "title": "Backend engineer",
    "hiringOrganization": {"@type": "Organization", "name": "Northwind s.r.o."},
    "description": "Python and PostgreSQL",
    "employmentType": "FULL_TIME",
    "baseSalary": {
      "@type": "MonetaryAmount",
      "currency": "EUR",
      "value": {
        "@type": "QuantitativeValue",
        "minValue": 2500,
        "maxValue": 3500,
        "unitText": "MONTH"
      }
    }
  }
  </script>
</head>
<body>
  <h1>Backend engineer</h1>
  <p>Python and PostgreSQL. Od 2 500 EUR brutto.</p>
  <ul>
    <li>Zodpovednosť za API</li>
  </ul>
</body>
</html>
